name: Generate Pac-Man Animation

# Renders the contribution-graph "Pac-Man" SVGs and pushes them to the
# `output` branch, where the README embeds them via raw.githubusercontent.com.
on:
  schedule:
    # Refresh twice a day so the graph stays in sync with new commits.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pacman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVGs (light + dark)
        uses: abozanona/pacman-contribution-graph@58eed59ded6e3cf31a90ac1f36ae7995e89336c6 # main, 2026-07-02
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      # The deploy step below force-pushes dist/ and commits even when it is
      # empty, so a silent generator failure would wipe the SVGs the README
      # embeds while the run still reported success. Check before pushing.
      - name: Verify the SVGs were generated
        run: |
          missing=0
          for svg in dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg; do
            if [ ! -s "$svg" ]; then
              echo "::error file=$svg::$svg is missing or empty"
              missing=1
            fi
          done
          exit $missing

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
